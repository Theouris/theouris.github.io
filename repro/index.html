      <h1>Step 1 - Reproductive</h1>

        </figure>

          <img src="Anatomy/diffpath.png" alt="Image">
          <figcaption>Differentiation Pathways. Note that external genitalia are determined by DHT, not SRY gene like internal genetalia are.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/urogenitalsinus.png" alt="Image">
          <figcaption>Urogenital Sinus develops into ext. genetalia and end of the hindgut in the GI system. </figcaption>
        </figure>
      </div>

        <figure>
          <img src="Anatomy/partsofurogenitalsinus.png" alt="Image">
          <figcaption>3 parts of the Urogenital Sinus: vesical, pelvic, and phallic.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/ducts.png" alt="Image">
          <figcaption>Reproductive Ducts. Male is mesonephric, female is paramesonephric. Remnants of both persist in males and females.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/maleanatomy.png" alt="Image">
          <figcaption>Male Anatomy. Note how ureters connect with the urethra. Also, the prostate develops from the urogenital sinus, not the mesonephros. Appendix of testes is a remnant of the paramesonephros.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/femaleinternalanatomy.png" alt="Image">
          <figcaption>Female Internal Anatomy. Epoop, Paroop, and Gartner all remnants.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/indiffextgenitalia.png" alt="Image">
          <figcaption>Indifferent External Genitalia develop from the urogenital sinus (deviation of hindgut).</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/dhtvsnodht.png" alt="Image">
          <figcaption>Ext. genitalia develop depending on the presence of DHT. Disorders of development depend on various factors, including DHT.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/turners.png" alt="Image">
          <figcaption>XO karyotype results in streak ovaries and less estrogen than normal. Increased FSH/LH lead to amenorrhea, short stature, and webbed neck.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/klinefelters.png" alt="Image">
          <figcaption>Klinefelter Syndrome</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/kallmann.png" alt="Image">
          <figcaption>Kallmann Syndrome: failure of GnRH neurons to migrate to the hypothalamus. This causes low FSH/LH, leading to delayed puberty. Also causes anosmia.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/manifestation-sywer-syndrome.png.webp" alt="Image">
          <figcaption>Manifestations of Swyer Syndrome. Swyer Syndrome is when an individual with XY karyotype has an SRY mutation, leading to female phenotype and streak gonads due to no AMH.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/androgeninsens.png" alt="Image">
          <figcaption>Androgen Insensitivity. SRY is functional, meaning no internal female genitalia. DHT does not work due to receptor malfunction, leading to female external genitalia that leads to a blind pouch.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/5areductasedeficiency.png" alt="Image">
          <figcaption>5 Alpha-Reductase Deficiency. No 5a-Reductase means no DHT, which means no male ext. genitalia. Also leads to blind pouch.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/cah.png" alt="Image">
          <figcaption>Congenital Adrenal Hyperplasia. Leads to an increase in DHT that causes virilization in females (XX karyotype) that leads to ambiguous ext. genitalia.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Anatomy/mullerianductanomalies.png" alt="Image">
          <figcaption>Mullerian Duct Anomalies. Failure of fusion leads to double uterus. Septate uterus is due to resorption of the uterine septum.</figcaption>
        </figure>

      <h2 id="Histology">Histology</h2>
      <div class="figure-row">
        <figure>
          <img src="Histo/primordialfollicle.png" alt="Image">
          <figcaption>Primordial Follicles form during the first 5 months of fetal life. There are a finite number (around 2 million) and no new follices form after birth. Surrounded by a single layer of simple squamous granulosa cells. Oocyte arrested in prophase I of meiosis I. </figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/lateprimaryfollicle.png" alt="Image">
          <figcaption>Late Primary Follicles have a stratified zona granulosa. Sperm bind to zona pellucida (via glycoproteins of the zona pellucida) during fertilization. Theca cells develop outside the granulosa layer (separated by a basement membrane) and respond to LH. </figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/secondary.png" alt="Image">
          <figcaption>The antrum is the fluid filled space within the granulosa layer that defines the second follicle. Granulosa layer, ZP, and oocyte are larger. Theca externa is a smooth-muscle like layer that provides structural support.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/follicularhormones.png" alt="Image">
          <figcaption>Follicular Hormones: FSH and LH. Zona granulosa binds to FSH, which causes the cells of the Zona Granulosa to convert androgens to estrogen via aromatase. Theca interna cells are stimulated by LH and make cholesterol into androgens for the granulosa cells via cholesterol desmolase.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/graafianfollicle.png" alt="Image">
          <figcaption>The Graafian follicle contains a large antrum that displaces the oocyte to one side. Oocyte is surrounded by granulosa cells called the corona radiata. Zona Pellucida and Corona radiata remains attached to the zona granulosa at one point. Theca interna and externa surround the zona granulosa. Granulosa cells begin to express LH receptors. Only one Graafian follicle typically matures and ovulates each cycle. Primary oocyte completes meiosis I just before ovulation. Secondary oocyte arrests in metaphase II until fertilization. Ovulation releases the secondary oocyte into the oviduct. Ovulated oocyte retains the zona pellucida and corona radiata</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/corpusl1.png" alt="Image">
          <figcaption>the Corpus Luteum forms from granulosa and theca interna cells after ovulation. LH maintains corpus luteum function after ovulation. hCG maintains the corpus luteum if implantation occurs.</figcaption>
          <img src="Histo/corpusl2.png" alt="Image">
          <figcaption>Granulosa lutein cells have pale, lipid-rich cytoplasm typical of steroid-producing cells. Theca lutein cells are smaller and more deeply stained. Granulosa lutein cells and theca lutein cells produce progesterone and some estrogen. </figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/atresia.png" alt="Image">
          <figcaption>Most developing follicles undergo atresia; only one typically ovulates each cycle. Falling FSH levels trigger atresia in secondary and small Graafian follicles.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/corpusalbicans.png" alt="Image">
          <figcaption>The Corpus Albicans forms when the corpus luteum degenerates in the absence of fertilization. Falling LH levels lead to apoptosis of granulosa lutein and theca lutein cells. Macrophages remove apoptotic cells and fibrous tissue replaces them. Placental hCG maintains the corpus luteum if implantation occurs.</figcaption>
        </figure>
      </div>
      <div class="figure-row">
        <figure>
          <img src="Histo/uterinetube.png" alt="Image">
          <figcaption>The uterine tube mucosa is very folded. The more proximal to the uterus, the thicker the smooth muscle layer is. The epithelium is simple columnar with cilia which move the ovum towards the uterus in the case of implantation. Non-ciliated (peg cells) cells provide lubrication and nourishment. Loss of cilia increase etopic pregnancy risk.</figcaption>
        </figure>
      </div>
